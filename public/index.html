<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 影像生成 Pro</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f2ed;
            --surface: #ffffff;
            --surface-soft: #f8f7f4;
            --surface-strong: #202124;
            --text: #191a1f;
            --muted: #646773;
            --faint: #8c909b;
            --line: #dedbd2;
            --accent: #1b7f79;
            --accent-dark: #11625d;
            --accent-soft: #e1f2ef;
            --warning: #946200;
            --shadow: 0 22px 60px rgba(54, 48, 38, 0.12);
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Arial, sans-serif;
            color: var(--text);
            background:
                linear-gradient(135deg, rgba(27, 127, 121, 0.12), transparent 34%),
                linear-gradient(315deg, rgba(209, 99, 53, 0.10), transparent 32%),
                var(--bg);
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            border: 0;
        }

        .app-shell {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 48px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: var(--radius);
            display: grid;
            place-items: center;
            color: white;
            background: linear-gradient(135deg, #1b7f79, #2a4f8f);
            box-shadow: 0 12px 26px rgba(27, 127, 121, 0.28);
            flex: 0 0 auto;
        }

        .brand h1 {
            margin: 0;
            font-size: 22px;
            line-height: 1.15;
            letter-spacing: 0;
        }

        .brand p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.76);
            color: var(--muted);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
        }

        .icon-button:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: white;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(320px, 410px) minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .panel,
        .gallery-panel {
            border: 1px solid rgba(222, 219, 210, 0.86);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.84);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
        }

        .panel {
            position: sticky;
            top: 20px;
            padding: 18px;
        }

        .section-label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 9px;
        }

        .field-stack {
            display: grid;
            gap: 14px;
        }

        .field {
            display: grid;
            gap: 7px;
        }

        label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 650;
        }

        .input-wrap {
            position: relative;
        }

        input[type="password"],
        textarea,
        select,
        input[type="number"] {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.92);
            color: var(--text);
            outline: 0;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        input[type="password"],
        select,
        input[type="number"] {
            height: 44px;
            padding: 0 12px;
        }

        textarea {
            min-height: 172px;
            resize: vertical;
            padding: 13px 48px 40px 13px;
            line-height: 1.55;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(27, 127, 121, 0.12);
        }

        .prompt-meta {
            position: absolute;
            left: 12px;
            bottom: 11px;
            color: var(--faint);
            font-size: 12px;
            pointer-events: none;
        }

        .upload-button {
            position: absolute;
            right: 10px;
            bottom: 10px;
            width: 32px;
            height: 32px;
            border-radius: var(--radius);
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            background: var(--surface-soft);
            color: var(--muted);
            cursor: pointer;
        }

        .upload-button:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
        }

        .file-chip {
            display: none;
            align-items: center;
            gap: 7px;
            min-width: 0;
            margin-top: -6px;
            padding: 7px 9px;
            border: 1px solid #b7d9d4;
            border-radius: var(--radius);
            background: var(--accent-soft);
            color: var(--accent-dark);
            font-size: 12px;
        }

        .file-chip.is-visible {
            display: flex;
        }

        .file-chip span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface-soft);
        }

        .toggle-row span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-top: 2px;
            line-height: 1.35;
        }

        .switch {
            position: relative;
            width: 42px;
            height: 24px;
            flex: 0 0 auto;
        }

        .switch input {
            position: absolute;
            inset: 0;
            opacity: 0;
        }

        .switch-track {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: #bbb7ad;
            transition: background 0.18s ease;
        }

        .switch-track::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
            transition: transform 0.18s ease;
        }

        .switch input:checked + .switch-track {
            background: var(--accent);
        }

        .switch input:checked + .switch-track::after {
            transform: translateX(18px);
        }

        .primary-button {
            width: 100%;
            min-height: 48px;
            border-radius: var(--radius);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            color: white;
            background: var(--accent);
            cursor: pointer;
            font-weight: 750;
            box-shadow: 0 16px 28px rgba(27, 127, 121, 0.22);
            transition: background 0.18s ease, box-shadow 0.18s ease;
        }

        .primary-button:hover {
            background: var(--accent-dark);
            box-shadow: 0 18px 34px rgba(27, 127, 121, 0.28);
        }

        .primary-button:disabled {
            cursor: wait;
            opacity: 0.72;
            box-shadow: none;
        }

        .notice {
            min-height: 37px;
            padding: 10px 11px;
            border-radius: var(--radius);
            background: #fff7df;
            color: var(--warning);
            font-size: 13px;
            line-height: 1.35;
            display: none;
        }

        .notice.is-visible {
            display: block;
        }

        .gallery-panel {
            min-height: calc(100vh - 104px);
            overflow: hidden;
        }

        .gallery-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px;
            border-bottom: 1px solid var(--line);
            background: rgba(248, 247, 244, 0.78);
        }

        .gallery-title h2 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 0;
        }

        .gallery-title p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .count-pill {
            min-width: 48px;
            height: 32px;
            border-radius: 999px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border: 1px solid var(--line);
            color: var(--muted);
            font-weight: 750;
            font-size: 13px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
            padding: 18px;
        }

        .empty-state {
            min-height: 420px;
            padding: 28px;
            display: grid;
            place-items: center;
            color: var(--muted);
            text-align: center;
        }

        .empty-state svg {
            color: var(--accent);
            margin-bottom: 14px;
        }

        .empty-state h3 {
            margin: 0 0 7px;
            color: var(--text);
            font-size: 18px;
        }

        .empty-state p {
            max-width: 360px;
            margin: 0;
            line-height: 1.55;
            font-size: 14px;
        }

        .task-card {
            position: relative;
            min-height: 282px;
            overflow: hidden;
            border-radius: var(--radius);
            border: 1px solid #25272d;
            background: var(--surface-strong);
            color: white;
            isolation: isolate;
        }

        .image-wrapper,
        .image-wrapper img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .image-wrapper img {
            object-fit: cover;
        }

        .content-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px;
            background: linear-gradient(180deg, rgba(32, 33, 36, 0.95), rgba(32, 33, 36, 0.98));
        }

        .task-card.success .content-overlay {
            justify-content: flex-end;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.03) 28%, rgba(0, 0, 0, 0.74) 100%);
        }

        .task-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: rgba(255, 255, 255, 0.72);
            font-size: 12px;
        }

        .task-status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 7px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.13);
            color: rgba(255, 255, 255, 0.86);
            font-weight: 700;
        }

        .task-status.failed {
            color: #ffd9d4;
            background: rgba(192, 57, 43, 0.28);
        }

        .task-body {
            display: grid;
            gap: 11px;
        }

        .task-prompt {
            margin: 0;
            display: -webkit-box;
            overflow: hidden;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            line-height: 1.45;
            font-size: 13px;
        }

        .task-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .task-tag {
            padding: 4px 7px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.13);
            color: rgba(255, 255, 255, 0.8);
            font-size: 11px;
            font-weight: 700;
        }

        .task-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 5;
            display: flex;
            gap: 6px;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .task-card:hover .task-actions,
        .task-card:focus-within .task-actions {
            opacity: 1;
            transform: translateY(0);
        }

        .task-action {
            width: 32px;
            height: 32px;
            border-radius: var(--radius);
            display: grid;
            place-items: center;
            color: white;
            background: rgba(0, 0, 0, 0.56);
            border: 1px solid rgba(255, 255, 255, 0.18);
            cursor: pointer;
        }

        .center-status {
            position: absolute;
            z-index: 4;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: none;
        }

        .center-status-inner {
            display: grid;
            justify-items: center;
            gap: 9px;
            color: rgba(255, 255, 255, 0.78);
            font-size: 13px;
            font-weight: 700;
            padding: 0 18px;
            text-align: center;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.13);
            border-top-color: #64d3ca;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .panel {
                position: static;
            }

            .gallery-panel {
                min-height: auto;
            }
        }

        @media (max-width: 620px) {
            .app-shell {
                width: min(100% - 20px, 1180px);
                padding-top: 16px;
            }

            .topbar,
            .gallery-header {
                align-items: flex-start;
            }

            .brand h1 {
                font-size: 19px;
            }

            .brand p,
            .toolbar {
                display: none;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
                padding: 12px;
            }

            .panel,
            .gallery-header {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l4.6-4.6a2 2 0 0 1 2.8 0L16 16"/><path d="m14 14 1.6-1.6a2 2 0 0 1 2.8 0L20 14"/><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
                </div>
                <div>
                    <h1>GPT Image Playground</h1>
                    <p>快速生成、比較與保留本機工作階段作品</p>
                </div>
            </div>
            <div class="toolbar" aria-label="工作階段工具">
                <button class="icon-button" id="clearHistoryBtn" type="button" title="清除歷史">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
                </button>
            </div>
        </header>

        <div class="layout">
            <section class="panel" aria-labelledby="creatorTitle">
                <div class="section-label" id="creatorTitle">Create</div>
                <div class="field-stack">
                    <div class="field">
                        <label for="apiKeyInput">API 金鑰</label>
                        <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off">
                    </div>

                    <div class="field">
                        <label for="promptInput">提示詞</label>
                        <div class="input-wrap">
                            <textarea id="promptInput" placeholder="描述主體、光線、構圖、材質與你想要的氛圍..."></textarea>
                            <span class="prompt-meta" id="promptMeta">0 字</span>
                            <input type="file" id="imageUploadInput" accept="image/png, image/jpeg, image/webp" hidden>
                            <button class="upload-button" id="triggerUploadBtn" type="button" title="上傳參考圖" aria-label="上傳參考圖">
                                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="file-chip" id="fileNameDisplay">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/></svg>
                        <span></span>
                    </div>

                    <div class="settings-grid">
                        <div class="field">
                            <label for="sizeSelect">尺寸</label>
                            <select id="sizeSelect">
                                <option value="auto">Auto</option>
                                <option value="1024x1024">1:1</option>
                                <option value="1024x1536">2:3</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="formatSelect">格式</label>
                            <select id="formatSelect">
                                <option value="png">PNG</option>
                                <option value="jpeg">JPEG</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="countInput">數量</label>
                            <input type="number" id="countInput" value="1" min="1" max="4" inputmode="numeric">
                        </div>
                        <div class="field">
                            <label for="qualitySelect">品質</label>
                            <select id="qualitySelect">
                                <option value="high" selected>High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </div>
                    </div>

                    <div class="toggle-row">
                        <div>
                            <label for="rewriteToggle">允許 AI 改寫提示詞</label>
                            <span id="rewriteHelp">關閉時會要求模型完整照原文執行</span>
                        </div>
                        <label class="switch" aria-label="允許 AI 改寫提示詞">
                            <input type="checkbox" id="rewriteToggle" aria-describedby="rewriteHelp">
                            <span class="switch-track"></span>
                        </label>
                    </div>

                    <div class="notice" id="noticeBox" role="status"></div>

                    <button id="generateBtn" class="primary-button" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>
                        <span>生成圖片</span>
                    </button>
                </div>
            </section>

            <section class="gallery-panel" aria-labelledby="galleryTitle">
                <div class="gallery-header">
                    <div class="gallery-title">
                        <h2 id="galleryTitle">工作階段區</h2>
                        <p>最近 20 筆結果會保留在這台瀏覽器</p>
                    </div>
                    <div class="count-pill" id="historyCount">0</div>
                </div>
                <div id="galleryMount"></div>
            </section>
        </div>
    </main>

    <script>
        const elements = {
            generateBtn: document.getElementById('generateBtn'),
            promptInput: document.getElementById('promptInput'),
            promptMeta: document.getElementById('promptMeta'),
            apiKeyInput: document.getElementById('apiKeyInput'),
            sizeSelect: document.getElementById('sizeSelect'),
            formatSelect: document.getElementById('formatSelect'),
            countInput: document.getElementById('countInput'),
            qualitySelect: document.getElementById('qualitySelect'),
            rewriteToggle: document.getElementById('rewriteToggle'),
            galleryMount: document.getElementById('galleryMount'),
            historyCount: document.getElementById('historyCount'),
            noticeBox: document.getElementById('noticeBox'),
            fileInput: document.getElementById('imageUploadInput'),
            triggerUploadBtn: document.getElementById('triggerUploadBtn'),
            fileNameDisplay: document.getElementById('fileNameDisplay'),
            clearHistoryBtn: document.getElementById('clearHistoryBtn')
        };

        let taskHistory = JSON.parse(localStorage.getItem('playground_history') || '[]');

        function escapeHTML(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function saveHistory() {
            localStorage.setItem('playground_history', JSON.stringify(taskHistory));
        }

        function getTimeString() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        function showNotice(message) {
            elements.noticeBox.textContent = message;
            elements.noticeBox.className = 'notice is-visible';
            window.clearTimeout(showNotice.timer);
            showNotice.timer = window.setTimeout(() => {
                elements.noticeBox.className = 'notice';
            }, 4200);
        }

        function updatePromptMeta() {
            const length = elements.promptInput.value.trim().length;
            elements.promptMeta.textContent = `${length} 字`;
        }

        function createCardHTML(task) {
            const isSuccess = task.status === 'success';
            const isFailed = task.status === 'failed';
            const statusLabel = isSuccess ? '完成' : isFailed ? '失敗' : '生成中';
            const safePrompt = escapeHTML(task.prompt);
            const rewriteLabel = task.strict === false ? 'AI 改寫' : '原文';
            const imageHTML = isSuccess ? `<div class="image-wrapper"><img src="${escapeHTML(task.url)}" alt="${safePrompt}"></div>` : '';
            const actionsHTML = isSuccess ? `
                <div class="task-actions">
                    <a class="task-action" href="${escapeHTML(task.url)}" download="gpt-image-${escapeHTML(task.id)}.${escapeHTML(task.format)}" title="下載圖片" aria-label="下載圖片">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                    </a>
                    <button class="task-action" type="button" data-copy-prompt="${escapeHTML(task.id)}" title="複製提示詞" aria-label="複製提示詞">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                </div>` : '';
            const centerStatusHTML = task.status === 'loading' ? `
                <div class="center-status"><div class="center-status-inner"><div class="spinner"></div><span>生成中...</span></div></div>` : isFailed ? `
                <div class="center-status"><div class="center-status-inner"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><span>${escapeHTML(task.error || '生成失敗')}</span></div></div>` : '';

            return `
                ${imageHTML}
                ${actionsHTML}
                <div class="content-overlay">
                    <div class="task-topline">
                        <span>${escapeHTML(task.time)}</span>
                        <span class="task-status ${isFailed ? 'failed' : ''}">${statusLabel}</span>
                    </div>
                    <div class="task-body">
                        <p class="task-prompt">${safePrompt}</p>
                        <div class="task-tags">
                            <span class="task-tag">${escapeHTML(task.size)}</span>
                            <span class="task-tag">${escapeHTML(task.format).toUpperCase()}</span>
                            <span class="task-tag">${escapeHTML(task.quality || 'high')}</span>
                            <span class="task-tag">${escapeHTML(task.n)} 張</span>
                            <span class="task-tag">${rewriteLabel}</span>
                        </div>
                    </div>
                </div>
                ${centerStatusHTML}
            `;
        }

        function renderGrid() {
            elements.historyCount.textContent = taskHistory.length;

            if (!taskHistory.length) {
                elements.galleryMount.innerHTML = `
                    <div class="empty-state">
                        <div>
                            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l4.6-4.6a2 2 0 0 1 2.8 0L16 16"/><path d="m14 14 1.6-1.6a2 2 0 0 1 2.8 0L20 14"/><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
                            <h3>還沒有作品</h3>
                            <p>輸入提示詞並生成圖片後，結果會顯示在這裡，方便你比較不同尺寸、格式與提示詞版本。</p>
                        </div>
                    </div>`;
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'gallery-grid';
            taskHistory.forEach(task => {
                const card = document.createElement('article');
                card.className = `task-card ${task.status === 'success' ? 'success' : ''}`;
                card.id = `task-${task.id}`;
                card.innerHTML = createCardHTML(task);
                grid.appendChild(card);
            });
            elements.galleryMount.replaceChildren(grid);
        }

        elements.triggerUploadBtn.addEventListener('click', () => {
            elements.fileInput.click();
        });

        elements.fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            elements.fileNameDisplay.querySelector('span').textContent = file.name;
            elements.fileNameDisplay.classList.add('is-visible');
            showNotice('參考圖已選取；目前後端尚未接上 image-to-image，會先保留在前端。');
        });

        elements.promptInput.addEventListener('input', updatePromptMeta);

        elements.clearHistoryBtn.addEventListener('click', () => {
            taskHistory = [];
            saveHistory();
            renderGrid();
        });

        elements.galleryMount.addEventListener('click', async (event) => {
            const copyButton = event.target.closest('[data-copy-prompt]');
            if (!copyButton) return;

            const task = taskHistory.find(item => item.id === copyButton.dataset.copyPrompt);
            if (!task) return;
            await navigator.clipboard.writeText(task.prompt);
            showNotice('提示詞已複製。');
        });

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('apple_image_api_key');
            if (savedKey) elements.apiKeyInput.value = savedKey;
            const savedRewrite = localStorage.getItem('allow_prompt_rewrite');
            elements.rewriteToggle.checked = savedRewrite === 'true';
            updatePromptMeta();
            renderGrid();
        });

        elements.rewriteToggle.addEventListener('change', () => {
            localStorage.setItem('allow_prompt_rewrite', String(elements.rewriteToggle.checked));
        });

        elements.generateBtn.addEventListener('click', async () => {
            const payload = {
                apiKey: elements.apiKeyInput.value.trim(),
                prompt: elements.promptInput.value.trim(),
                size: elements.sizeSelect.value,
                format: elements.formatSelect.value,
                quality: elements.qualitySelect.value,
                n: Math.min(Math.max(parseInt(elements.countInput.value, 10) || 1, 1), 4),
                strict: !elements.rewriteToggle.checked
            };

            if (!payload.apiKey || !payload.prompt) {
                showNotice('請先填寫 API 金鑰與提示詞。');
                return;
            }

            localStorage.setItem('apple_image_api_key', payload.apiKey);
            localStorage.setItem('allow_prompt_rewrite', String(elements.rewriteToggle.checked));
            elements.countInput.value = payload.n;

            const taskId = Date.now().toString();
            const newTask = {
                id: taskId,
                status: 'loading',
                time: getTimeString(),
                prompt: payload.prompt,
                size: payload.size,
                format: payload.format,
                quality: payload.quality,
                n: payload.n,
                strict: payload.strict
            };

            taskHistory.unshift(newTask);
            if (taskHistory.length > 20) taskHistory = taskHistory.slice(0, 20);
            renderGrid();

            elements.generateBtn.disabled = true;
            elements.generateBtn.querySelector('span').textContent = '生成中...';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                const taskIndex = taskHistory.findIndex(task => task.id === taskId);
                if (taskIndex === -1) return;

                if (data.error || !data.images) {
                    taskHistory[taskIndex].status = 'failed';
                    taskHistory[taskIndex].error = data.error || '沒有收到圖片資料';
                } else {
                    taskHistory[taskIndex].status = 'success';
                    taskHistory[taskIndex].url = data.images[0];

                    for (let index = 1; index < data.images.length; index += 1) {
                        taskHistory.splice(taskIndex + index, 0, {
                            ...newTask,
                            id: `${taskId}-${index}`,
                            status: 'success',
                            url: data.images[index]
                        });
                    }
                    taskHistory = taskHistory.slice(0, 20);
                }
            } catch (error) {
                const taskIndex = taskHistory.findIndex(task => task.id === taskId);
                if (taskIndex !== -1) {
                    taskHistory[taskIndex].status = 'failed';
                    taskHistory[taskIndex].error = '連線失敗';
                }
            } finally {
                elements.generateBtn.disabled = false;
                elements.generateBtn.querySelector('span').textContent = '生成圖片';
                saveHistory();
                renderGrid();
            }
        });
    </script>
</body>
</html>
